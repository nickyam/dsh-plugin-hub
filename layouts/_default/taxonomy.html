{{ define "main" }}
{{ $label := .Title }}{{ with index hugo.Data.derived.category_map .Title }}{{ $label = . }}{{ end }}
<div class="wrap list-page">
  <nav class="breadcrumb" aria-label="面包屑">
    <a href="{{ "/" | relURL }}">首页</a><span>/</span>
    <a href="{{ "categories/" | relURL }}">分类</a><span>/</span><span>{{ $label }}</span>
  </nav>
  <header class="page-head">
    <h1>{{ $label }}</h1>
    <p>{{ len .Pages }} 个插件 · 按证据充分度排序</p>
  </header>
  <div class="cards">
    {{ range sort .Pages "Weight" "desc" }}{{ partial "card.html" . }}{{ end }}
  </div>
  <p class="back-link"><a href="{{ "plugins/" | relURL }}">← 回到全部插件</a></p>
</div>
{{ end }}
