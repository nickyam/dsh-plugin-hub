{{ define "main" }}
<div class="wrap list-page">
  <nav class="breadcrumb" aria-label="面包屑"><a href="{{ site.Home.RelPermalink }}">首页</a><span>/</span><span>{{ .Title }}</span></nav>
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>

  {{ if eq .Section "plugins" }}
    <div class="cards">
      {{ range sort .Pages "Weight" "desc" }}{{ partial "card.html" . }}{{ end }}
    </div>
  {{ else }}
    <ul class="plain-list">{{ range .Pages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>
  {{ end }}
</div>
{{ end }}
