{{ $p := . }}
{{ if gt $p.TotalPages 1 }}
<nav class="list-pager" aria-label="分页">
  {{ if $p.HasPrev }}<a href="{{ $p.Prev.URL }}" rel="prev" aria-label="上一页">‹</a>{{ else }}<span aria-hidden="true">‹</span>{{ end }}
  {{ range $p.Pagers }}
    {{ if eq .PageNumber $p.PageNumber }}<span class="is-current" aria-current="page">{{ .PageNumber }}</span>{{ else }}<a href="{{ .URL }}">{{ .PageNumber }}</a>{{ end }}
  {{ end }}
  {{ if $p.HasNext }}<a href="{{ $p.Next.URL }}" rel="next" aria-label="下一页">›</a>{{ else }}<span aria-hidden="true">›</span>{{ end }}
</nav>
{{ end }}
