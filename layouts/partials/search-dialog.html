{{/* 全站搜索浮层。数据来自 static/search.json（build_data.py 生成），首次打开才 fetch。 */}}
<dialog class="search-dialog" id="site-search" aria-label="搜索插件">
  <div class="search-dialog-head">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="site-search-input" type="search" placeholder="搜插件名、别名、功能，例如 微信 / 记忆 / 剪贴板" autocomplete="off" aria-label="搜索插件" aria-controls="site-search-results">
    <kbd>Esc</kbd>
    <button class="search-dialog-close" type="button" data-search-close aria-label="关闭搜索">×</button>
  </div>
  <div class="search-dialog-body">
    <p class="search-hint" id="site-search-hint">按名字、别名、标签、功能亮点搜；↑↓ 选择，回车打开。</p>
    <ul class="search-list" id="site-search-results" role="listbox" aria-label="搜索结果"></ul>
    <p class="search-empty" id="site-search-empty" hidden></p>
  </div>
</dialog>
