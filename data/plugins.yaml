  summary: 火山引擎 OpenViking 官方出的 DSH 接入包：每轮按你自己说的话自动召回记忆与画像，会话过程自动采集、到阈值自动提交，并把 OpenViking 服务端的 MCP 工具与 skills 挂进 DSH；前提是有一个连得通的 OpenViking 服务。
  features:
