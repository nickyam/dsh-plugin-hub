# ── 安全与治理 ─────────────────────────────────────────────────
- id: dsh-plugin-gate
  name: dsh-plugin-gate
  category: security
  status: community
  repo: https://github.com/863683348/dsh-plugin-gate
  install: dsh plugin --profile web add dsh-plugin-gate
  summary: DSH 的安装安全门与数据保护守卫：在 dsh plugin add 之前用 60 条静态规则扫描插件源码（恶意脚本/凭证窃取/混淆/网络回连），并用 gate_guard 在执行 rm -rf 类危险命令前拦截或要求确认。
  features:
  - 60 条静态签名规则：覆盖安装脚本、混淆、权限读取、网络回连、硬编码密钥与供应链（Google OSV）
  - gate_scan：只读扫描本地目录或 npm tarball，绝不执行被扫代码、绝不写文件
  - gate_guard：执行 rm -rf 类危险命令前评估，按工作区边界与关键文件返回 BLOCK / WARN / PASS
  - gate_diff / gate_report：与基线对比新/已解决/变更的风险点，可导出 Markdown / JSON 报告
  - 上下文感知降级：注释与文档中的示例代码降为低危，密钥与 webhook 即便在注释中也仍标记
  tags:
  - 安装前扫描
  - 安全
  notes: 网关只读、绝不执行被扫代码、绝不写文件；它是启发式签名扫描，可能漏检新型恶意代码或误报无辜代码，BLOCK/WARN 需自行复核。仅作安装前与危险命令前的额外护栏。
  refs:
  - tree-top10
  - deepseekai-works
- id: dsh-gov
  name: dsh-gov
  category: security
  status: community
  repo: https://github.com/863683348/dsh-gov
  install: dsh plugin --profile web add dsh-gov
  summary: Agent 治理套件（企业配套）：基于策略的工具门控（允许/拒绝/询问）、只追加的结构化 JSONL 审计日志，以及按 agent 的 token 配额与周期预算，状态持久化在 $DSH_HOME/gov/。
  features:
  - 策略门禁：按工具/agent/工作区配置 allow / deny / ask 规则，支持通配符与优先级，平局 fail-closed（deny > ask > allow）
  - 结构化审计日志：每次工具调用的决定与结果写入只追加的 JSONL（audit.jsonl），可查询可导出，刻意不记参数
  - 按 agent 的 token 配额：日/周/月/总周期预算，超限向上下文注入警告，可一键重置
  - 单一 gov 工具：status / policy_* / audit_* / quota_* 一整套动作，跨工作区全局一致
  - fail-safe 设计：计量或持久化失败绝不阻塞 agent，纯逻辑分层、零依赖、可单测
  tags:
