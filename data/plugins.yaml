  - 双语文档：提供英文与简体中文 README，通过 awesome-lint 校验
  - 透明来源：内容抓取自 dsh-external/hub 官方目录与公开 GitHub dsh-plugin 主题
  - 贡献指引：含安装说明、贡献指南与公开议题追踪
  tags:
