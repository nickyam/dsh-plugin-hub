  - 压缩与恢复：压缩完成后补一条 <openviking-context> 提示，给出会话 id 与用 session_history 找回细节的方法
  - 诊断：scripts/ov-memory-doctor.mjs 一次查安装、凭据配置与服务连通性（--json / --offline / --timeout / --no-color）
