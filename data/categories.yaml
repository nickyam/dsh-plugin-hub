# 分类表：id 用于 URL 与筛选，label 用于展示
- id: market
  label: 插件市场与发现
  desc: 找插件、装插件、管版本
- id: ui
  label: 界面与体验
  desc: 侧边栏、主题、桌面端、交互挂件
- id: tool
  label: 工具与能力
  desc: 搜索、浏览器、视觉、文件引用
- id: workflow
  label: 协作与工作流
  desc: 多智能体、任务编排、代码审阅
- id: memory
  label: 记忆与知识
  desc: 跨会话记忆、项目上下文、知识库
- id: billing
  label: 模型与计费
  desc: 余额、用量、成本可视化
- id: security
  label: 安全与治理
  desc: 安装前扫描、权限策略
- id: integration
  label: 集成与迁移
  desc: 微信、其他 Agent、MCP 桥接
- id: fun
  label: 娱乐与彩蛋
  desc: 皮肤、桌宠、小游戏
- id: model
  label: 免费模型与接入
  desc: 免 API Key、订阅复用、网页凭证
- id: visual
  label: 视觉与设计
  desc: 看图、UI 还原、图表与设计资产
- id: content
  label: 内容创作与办公
  desc: 长文写作、PPT、表格与文档
- id: remote
  label: 移动端与远程
  desc: 手机客户端、远程接管、iOS 调试
