# 口径核对：多篇文章说法不一致时，不替读者「选一个对的」，把各方原话并列摆出来
# level: 待核对 / 已并存 / 不采信
# 说明：本站只收需要额外安装的插件，官方开箱即用的内置能力不建条目；
#       官网口径只在这里作为「二手文章说法为什么对不上」的对照出现。

- id: market-install
  title: "dsh-market 到底怎么装？三种写法"
  level: 已并存
  summary: "三篇文章都说「先装插件市场」，但给的入口写法不完全一样。"
  sides:
    - source: wx-dabaihua
      claim: "在插件页面右上角点「添加」，输入 https://github.com/dsh-market/dsh-market；失败可尝试输入插件名称 dshmarket@1.73.6。"
    - source: tree-top10
      claim: "dsh plugin --profile web add dshmarket（命令行写法）。"
    - source: wx-quanjing
      claim: "dsh-market：DSH 内置的可视化插件市场，支持浏览、搜索、一键安装；GitHub 地址同为 https://github.com/dsh-market/dsh-market。"
  handling: "两篇独立文章都指向同一个仓库地址，本站用 GitHub API 确认该仓库存在，因此 dsh-market 的 repo 字段填这个地址；按「名称@版本」添加与命令行 add 两条路径仍并列保留，可能对应不同版本或 profile 机制，安装字段不替读者选一个。注：wx-quanjing 用「内置」形容插件市场嵌在 DSH 界面里，该插件仍需单独安装，与本站不收录的开箱即用能力不是一回事。"

- id: web-all
  title: "Web 全家桶：到底是 dsh-web-ui-all 还是 dsh-web-all？"
  level: 已并存
  summary: "同一族能力在两篇文章里叫了三个名字。"
  sides:
    - source: wx-dabaihua
      claim: "dsh-web-ui-all：把常用的 DSH Web 插件做成了一个全家桶，支持任务看板、Git 记录、实时统计、远程访问、桌面宠物和皮肤。"
    - source: tree-top10
      claim: "dsh-web full suite / @linxin666/dsh-web-all@latest：task dashboards, remote mobile control, SSH operation panels, usage statistics and conversation archives。"
  handling: "功能描述高度重叠，本站按同一条目收录，三个名字都进 aliases 便于搜索；但「是否同一个仓库」未经确认，卡片上挂了「名称有出入」标记。"

- id: scale
  title: "生态规模数字：时间点与统计口径都不同"
  level: 不采信
  summary: "星标数、仓库数、插件数在两处差异很大，且各自没写清统计时刻。"
  sides:
    - source: wx-dabaihua
      claim: "开源 12 小时星标破 5 万、24 小时破 7 万、一个月 20 万+；带 #dsh-plugin 标签的仓库 700 多个、插件 5100 多个。"
    - source: baike-dsh
      claim: "半小时内 GitHub 星数破万、截至发稿超过 10 万；发布不到 24 小时已有 288 个插件仓库；截至 2026 年 8 月，带 dsh-plugin 标签的公开仓库超过 700 个。"
    - source: tree-top10
      claim: "Star counts and metadata are sourced from GitHub and the awesome-dsh-plugin public page on September 15, 2026。"
    - source: wx-quanjing
      claim: "「DeepSeek Harness 在 GitHub 上超过 25 万 Stars」，并附 Top20 插件 Stars 排行榜与 14 类插件的逐条 Stars。"
  handling: "快速增长期的时间切片 + 「仓库 / 插件 / 标签」三种不同计数单位，混在一起比较没有意义。本站另用 GitHub API 抽查了 4 个仓库的当前 star 数，均高于文中数值，进一步说明这只是成文时刻的切片。本站一律不把任何单一数字写进插件卡或首页统计，只保留「多来源提及社区生态活跃」这一定性结论。"

- id: teams
  title: "dsh-agent-teams 与官网 Agent teams 名字撞车"
  level: 已并存
  summary: "百科与清单文提到的社区插件 dsh-agent-teams，和官网界面里标为 Experimental 的 Agent teams 名字几乎一样。"
  sides:
    - source: baike-dsh
      claim: "dsh-agent-teams 支持在会话中快速组建和管理多智能体协作团队。"
    - source: official-harness
      claim: "官网界面 Plugins 列表下有 Agent teams（标为 Experimental），与 Terminal、Agent loop、Subagents 并列。"
  handling: "官网那项属开箱即用的内置能力，按本站收录范围不建条目；这里只保留需要单独安装的社区插件 dsh-agent-teams，并把三篇提到它的引文都挂在它名下。两者是否为同一实现未确认，装之前请以仓库 README 为准。"

- id: count-36-46
  title: "标题写「36 款」，正文实际列了 46 个"
  level: 已并存
  summary: "《插件全景推荐》标题说 36 款，按正文十四个分类逐个点数却是 46 个条目。"
  sides:
    - source: wx-quanjing
      claim: "标题「DeepSeek Harness 插件全景推荐：14 大类、36 款值得装的插件」；正文按一类 6 / 3 / 2 / 1 / 8 / 3 / 4 / 2 / 3 / 4 / 3 / 1 / 3 / 3 个条目展开，合计 46，文末另有 Top20 排行与「三条实用建议」。"
  handling: "大概率是成文过程中追加了后面几类却没回头改标题（写到第十类时正好 36 个）。本站按正文实际抽出 46 条插件引用（7 条并入已有插件的证据链、39 条新建条目），与逐类点数一致；标题数字不作为插件总数，也不写进首页统计。"

- id: dsh-web-name
  title: "dsh-web、dsh-web-all、Web 全家桶：三个名字别混"
  level: 已并存
  summary: "同一批来源里出现了三个高度相似但描述不同的名字。"
  sides:
    - source: wx-quanjing
      claim: "dsh-web：DSH Web 端的插件聚合生态，通过「创意工坊」分发插件；GitHub 地址 https://github.com/zhu1090093659/dsh-web。"
    - source: wx-dabaihua
      claim: "dsh-web-ui-all：把常用的 DSH Web 插件做成了一个全家桶，支持任务看板、Git 记录、实时统计、远程访问、桌面宠物和皮肤。"
    - source: tree-top10
      claim: "译述：dsh-web full suite / @linxin666/dsh-web-all 把任务看板、远程控制、SSH 面板、用量统计、会话归档等模块打包。"
  handling: "后两条功能重叠，已合并进同一个「dsh-web-all（Web 全家桶）」条目并把别名全部保留；第一条指向另一个仓库、定位是「插件分发入口」，本站单独立项并加「名称相近」标记，不强行合并。真要动手装之前，请以仓库 README 为准。"
