# 正式地址：https://ai.limzero.com/dsh/ （ECS 上 ai.limzero.com 主站的 /dsh 子目录）
# 🔴 子路径部署：全站链接一律用 relURL / RelPermalink，只改这里就能整体带上 /dsh 前缀。
# 🔴 ads.txt / robots.txt 必须放在主站域名根目录才生效（Google 不读子目录里的副本），
#    详见 README「上线前必做」与 deploy/deploy.sh 顶部说明。
# 部署：./deploy/deploy.sh（rsync 到 ECS 的 index/dsh/）；Cloudflare Pages 仅作备选。
baseURL = "https://ai.limzero.com/dsh/"
locale = "zh-CN"
title = "DSH 插件图谱"
enableRobotsTXT = true
enableGitInfo = false

[params]
  description = "把散落在公众号、官方文档与目录站里的 DeepSeek Harness 插件说法汇总到一处：同一插件去重、多篇印证、说法有出入的单独标出。"
  tagline = "把散落各处的 DSH 插件说法，收到一处"

[taxonomies]
  category = "categories"
  tag = "tags"

# 谷歌广告：沿用你账号里已有的发布商 ID。
# 用的是 Auto Ads（全站自动插位），不需要单独建广告单元。
# 🔴 ads.txt 要放到 https://ai.limzero.com/ads.txt（主站根目录），本仓库 static/ads.txt 只是副本。
# 上线前确认 AdSense 后台的站点列表已覆盖 ai.limzero.com。
# 本地预览时脚本可能被网络拦住，属正常现象；想彻底关掉把 enabled 改成 false 即可。
[params.adsense]
  enabled = true
  client = "ca-pub-7114121088728794"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
