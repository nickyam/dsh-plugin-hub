# 正式地址：https://ai.limzero.com/dsh/ （ECS 上 ai.limzero.com 主站的 /dsh 子目录）
# 🔴 子路径部署：全站链接一律用 relURL / RelPermalink，只改这里就能整体带上 /dsh 前缀。
# 🔴 ads.txt / robots.txt 必须放在主站域名根目录才生效（Google 不读子目录里的副本），
#    详见 README「上线前必做」与 deploy/deploy.sh 顶部说明。
# 部署：./deploy/deploy.sh（rsync 到 ECS 的 index/dsh/）；Cloudflare Pages 仅作备选。
baseURL = "https://ai.limzero.com/dsh/"
locale = "zh-CN"
title = "DSH 插件图谱"
enableRobotsTXT = true
# sitemap 的 lastmod 用 git 提交日期：比在 front matter 里写构建时间准确，
# 也不会让每次构建都改一遍 133 个 content/plugins/*.md（diff 噪音）。
enableGitInfo = true

[params]
  description = "顺着名字找到 DeepSeek Harness 插件的官方 GitHub 仓库，读 README 把简介、安装与功能亮点整理成能查的卡片。"
  tagline = "把散落各处的 DSH 插件，收到一处"

[taxonomies]
  category = "categories"
  tag = "tags"

# RSS 只留首页：分类/标签/插件列表的 index.xml 没人订阅，纯属产物噪音
# （之前 tags/index.xml 76KB、plugins/index.xml 68KB）。
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
  page = ["HTML"]

# 谷歌广告：2026-11-21 从「Auto Ads 自动插位」改为「固定位手动广告」。
# [params.adsense.enabled] 是 Auto Ads 总开关，保持 false——不做全站自动插位、不启用
# enable_page_level_ads，从根上避开窄屏锚定广告盖住 sticky header 的问题（见优化复盘）。
# [params.adsense.fixed] 才是本站现在实际投放的固定广告位：只在模板指定位置放少量手动单元，
# 全部响应式、落在文档流里。这是本站独立配置，与 WordPress 总站 limzero.com 无关。
# 🔴 slot 用本站自己在 AdSense 后台新建的展示广告单元（响应式尺寸），不复用主站单元。
#    换单元只改这里三个 slot 的 ID，模板不用动。新建单元务必选「响应式」，
#    生成的代码里 data-ad-format=auto + data-full-width-responsive=true 与本模板一致。
# 🔴 关掉全部固定广告：把 fixed.enabled 改 false；恢复 Auto Ads：把上面的 enabled 改 true。
# 🔴 广告是 AdSense 站点级（按 limzero.com 一个 site 管理）；ads.txt 要放到
#    https://ai.limzero.com/ads.txt（主站根目录），本仓库 static/ads.txt 只是副本。
[params.adsense]
  enabled = false
  client = "ca-pub-7114121088728794"

  [params.adsense.fixed]
    enabled = true
    # 正文单元「DSH插件-正文内」：插件详情页「速览」之后，响应式横幅
    slot_content = "9256261574"
    # 侧栏单元「DSH插件-侧栏」：首页 / 详情页侧栏，自适应矩形
    slot_side = "9200421256"
    # 列表单元「DSH插件-列表页」：插件库 / 分类 / 标签页卡片流上方，响应式横幅
    slot_list = "5536508411"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  # 代码高亮：默认会把 monokai 的深色内联样式写进 <pre>，和浅色纸面对冲（guide 页第一版就是这么翻车的）。
  # 改成输出 class，配色由 assets/css/main.css 里那几行 .chroma 规则控制。
  [markup.highlight]
    noClasses = false
    style = "friendly"
    tabWidth = 2
